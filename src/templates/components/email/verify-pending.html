<div class="pending-verify">
  <h3 class="email-section-label">Awaiting verification</h3>
  <div class="email-row">
    <span class="email-pending-address">{{pendingEmail}}</span>
    <span class="status-badge status-badge--pending">Pending</span>
  </div>
  <p class="email-pending-hint">Enter the 6-digit PIN sent to this address to add it.</p>
  <div class="email-row">
    <form class="form-inline" method="POST" action="/api/email/verify">
      {{csrfField}}
      <input type="text" name="pin" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000">
      <button type="submit" class="btn btn--sm">Verify →</button>
    </form>
    <form class="form-inline" method="POST" action="/api/email/resend">
      {{csrfField}}
      <button type="submit" class="btn btn--ghost btn--sm">Resend PIN</button>
    </form>
    <form class="form-inline" method="POST" action="/api/email/cancel">
      {{csrfField}}
      <button type="submit" class="btn btn--ghost btn--sm">Discard</button>
    </form>
  </div>
</div>
