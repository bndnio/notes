<script>
  function storageWouldDisable() {
    var checkbox = document.getElementById('storage-enabled');
    return checkbox.dataset.wasEnabled === 'true' && !checkbox.checked;
  }

  document.addEventListener('change', function (event) {
    if (event.target.id !== 'storage-enabled') return;
    document.getElementById('storage-disable-warning').hidden = !storageWouldDisable();
  });

  document.addEventListener('submit', function (event) {
    if (event.target.id !== 'storage-settings-form') return;
    if (storageWouldDisable() &&
        !confirm('Turning off storage will permanently delete all your saved notes. Continue?')) {
      event.preventDefault();
    }
  });
</script>
