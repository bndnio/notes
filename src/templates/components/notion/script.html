<script>
  function openNotionPopup() {
    var btn = document.getElementById('notion-connect-btn');
    if (btn) {
      btn.disabled = true;
      if (!btn.querySelector('.btn-spinner')) {
        var spinner = document.createElement('span');
        spinner.className = 'btn-spinner';
        btn.appendChild(spinner);
      }
    }

    var popup = window.open('/api/notion/connect', 'notion-oauth', 'width=600,height=700,menubar=no,toolbar=no,location=no');
    if (!popup) {
      if (btn) {
        btn.disabled = false;
        var s = btn.querySelector('.btn-spinner');
        if (s) s.remove();
      }
      window.location.href = '/api/notion/connect';
    }
  }

  // The picker is only rendered while database choices are pending; otherwise
  // the server fetches them and redirects back with ?modal=notion-select.
  function openNotionModal() {
    if (!document.getElementById('notion-select-overlay')) {
      window.location.href = '/api/notion/select';
      return;
    }
    openModal('notion-select');
  }
</script>
