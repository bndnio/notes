<div class="modal-overlay" id="notion-select-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2>Choose a database</h2>
      <button class="modal-close" onclick="closeModal('notion-select')">✕</button>
    </div>
    <form method="POST" action="/api/notion/select">
      {{csrfField}}
      <div class="modal-body">
        <p class="subtitle">Your database needs <code>Name</code> (Title), <code>Date</code> (Date), and <code>From</code> (Text) properties.</p>
        {{schemaError}}
        {{databases}}
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn btn--red">Save →</button>
        <button type="button" class="btn btn--ghost" onclick="closeModal('notion-select')">Cancel</button>
      </div>
    </form>
  </div>
</div>
