<div class="note-body">
  <p class="note-body-meta">From {{from}}<span {{toHidden}}> · To {{to}}</span></p>
  <div class="note-body-text">{{body}}</div>
  <div class="note-body-actions">
    <a href="/notes/{{id}}/md" download>Download .md</a>
    <a href="/notes/{{id}}/eml" download {{emailHidden}}>Original email</a>
  </div>
</div>
