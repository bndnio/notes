<div class="note-body">
  <p class="note-body-meta">From {{from}}<span {{toHidden}}> · To {{to}}</span></p>
  <pre class="note-body-text">{{body}}</pre>
  <div class="btn-row">
    <a class="btn btn--ghost btn--sm" href="/notes/{{id}}/md" download>Download .md</a>
    <a class="btn btn--ghost btn--sm" href="/notes/{{id}}/eml" download {{emailHidden}}>Original email</a>
  </div>
</div>
