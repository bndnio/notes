<li>
  <details class="notes-row" data-note-id="{{id}}">
    <summary class="notes-row-summary">
      <time class="notes-row-time" datetime="{{iso}}">{{time}}</time>
      <span class="notes-row-subject">{{subject}}</span>
      <span class="notes-row-from">{{from}}</span>
    </summary>
    <div class="notes-row-body"></div>
    <div class="note-actions">
      <a href="/notes/{{id}}/md" download>Download .md</a>
      <a href="/notes/{{id}}/eml" download {{emailHidden}}>Original email</a>
      <form class="note-delete" method="POST" action="/notes/{{id}}/delete" data-note-subject="{{subject}}">
        {{csrfField}}
        <button type="submit">Delete</button>
      </form>
    </div>
  </details>
</li>
